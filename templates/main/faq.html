{% extends "base.html" %}
{% block title %}FAQ{% endblock %}
{% block content %}
<div class="container section">
<h1>Frequently Asked Questions</h1>
{% for faq in faqs %}
<div class="card" style="margin-bottom:12px;padding:20px">
<h3>{{ faq.question }}</h3>
<p>{{ faq.answer }}</p>
</div>
{% endfor %}
</div>
{% endblock %}
