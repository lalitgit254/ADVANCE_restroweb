{% extends "layouts/dashboard.html" %}
{% block page_title %}Create Admin{% endblock %}
{% block dashboard_content %}
<form method="POST" class="card" style="padding:24px">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-row">
<div class="form-group"><label>First Name</label><input name="first_name" class="form-control" required></div>
<div class="form-group"><label>Last Name</label><input name="last_name" class="form-control" required></div>
</div>
<div class="form-group"><label>Email</label><input name="email" type="email" class="form-control" required></div>
<div class="form-group"><label>Password</label><input name="password" type="password" class="form-control" required></div>
<div class="form-group"><label>Role</label><select name="role" class="form-control"><option value="admin">Admin</option><option value="manager">Manager</option></select></div>
<div class="form-group"><label>Restaurant</label><select name="restaurant_id" class="form-control">{% for r in restaurants %}<option value="{{ r.id }}">{{ r.name }}</option>{% endfor %}</select></div>
<button class="btn btn-primary">Create Account</button>
</form>
{% endblock %}
