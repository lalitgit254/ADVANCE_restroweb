{% extends "layouts/dashboard.html" %}
{% block page_title %}Profile{% endblock %}
{% block dashboard_content %}
<form method="POST" class="card" style="padding:24px;max-width:500px">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label>First Name</label><input name="first_name" value="{{ current_user.first_name }}" class="form-control"></div>
<div class="form-group"><label>Last Name</label><input name="last_name" value="{{ current_user.last_name }}" class="form-control"></div>
<div class="form-group"><label>Phone</label><input name="phone" value="{{ current_user.phone or '' }}" class="form-control"></div>
<div class="form-group"><label>Language</label><select name="language" class="form-control"><option value="en" {{ 'selected' if current_user.language=='en' }}>English</option><option value="hi" {{ 'selected' if current_user.language=='hi' }}>Hindi</option></select></div>
<div class="form-check"><input type="checkbox" name="dark_mode" {{ 'checked' if current_user.dark_mode }}> Dark Mode</div>
<button class="btn btn-primary">Save</button>
</form>
{% if loyalty %}<div class="stat-card" style="margin-top:20px"><div class="stat-info"><h3>{{ loyalty.membership_level|title }}</h3><p>{{ loyalty.total_points }} points</p></div></div>{% endif %}
{% endblock %}
