{% extends "base.html" %}
{% block title %}Payment{% endblock %}
{% block content %}
<div class="container section">
<h1>Payment - ₹{{ "%.2f"|format(order.total_amount) }}</h1>
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label>Payment Method</label>
<select name="method" class="form-control"><option value="upi">UPI</option><option value="credit_card">Credit Card</option><option value="debit_card">Debit Card</option><option value="net_banking">Net Banking</option><option value="wallet">Wallet</option><option value="cash">Cash</option></select>
</div>
<button type="submit" class="btn btn-primary btn-lg">Pay Now</button>
</form>
</div>
{% endblock %}
