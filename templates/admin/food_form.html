{% extends "layouts/dashboard.html" %}
{% block sidebar %}{% include "admin/_sidebar.html" %}{% endblock %}
{% block page_title %}Add Food Item{% endblock %}
{% block dashboard_content %}
<div class="card"><div class="card-body">
<form method="POST" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label>Name</label><input name="name" class="form-control" required></div>
<div class="form-group"><label>Category</label><select name="category_id" class="form-control">{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div>
<div class="form-group"><label>Description</label><textarea name="description" class="form-control"></textarea></div>
<div class="form-group"><label>Price</label><input name="price" type="number" step="0.01" class="form-control" required></div>
<div class="form-group"><label>Image</label><input name="image" type="file" accept="image/*" class="form-control"></div>
<div class="form-check"><input type="checkbox" name="is_veg" checked> Veg</div>
<div class="form-check"><input type="checkbox" name="is_special"> Today's Special</div>
<div class="form-check"><input type="checkbox" name="is_bestseller"> Bestseller</div>
<button type="submit" class="btn btn-primary">Save</button>
</form>
</div></div>
{% endblock %}
